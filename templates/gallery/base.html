<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}{{ site_settings.site_name }}{% endblock %}</title><link rel="stylesheet" href="/static/site.css"></head><body><header><a class="brand" href="{% url 'home' %}">{{ site_settings.site_name }}</a><nav>{% if user.is_staff %}<a href="{% url 'dashboard' %}">Admin</a>{% endif %}{% if user.is_authenticated %}<span>{{ user.username }}</span><a href="{% url 'logout' %}">Log out</a>{% else %}<a href="{% url 'login' %}">Log in</a><a class="btn" href="{% url 'signup' %}">Sign up</a>{% endif %}</nav></header>{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}<main>{% block content %}{% endblock %}</main><footer>{{ site_settings.footer_text }}</footer></body></html>
